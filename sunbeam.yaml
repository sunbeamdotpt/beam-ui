schema: 1
project:
  name: beam-ui
  kind: deno-app
  description: "Beam Design Language — Preact/React component library (JSR @sunbeam/beam-ui), showcase site, and Storybook."
targets:
  build:
    exec: "npm run build"
    cwd: app
  test:
    exec: "deno task test"
  lint:
    exec: "deno lint"
  fmt:
    exec: "deno fmt"
  dev:
    exec: "npm run dev"
    cwd: app
  clean:
    exec: "rm -rf app/dist app/storybook-static"
  package:
    # Local verification only; the release image is built multi-arch by
    # .github/workflows/release.yml and pushed to ghcr.io.
    exec: "docker buildx build -t ghcr.io/sunbeamdotpt/beam-ui:latest ."
  deploy: skip
outputs:
  - app/dist
  - ghcr.io/sunbeamdotpt/beam-ui:latest
